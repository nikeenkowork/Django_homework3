[project]
name = "django-homework3"
version = "0.1.0"
description = ""
authors = [
    {name = "Denys",email = "nikeenko89@gmail.com"}
]
python = ">=3.11,<4.0"
dependencies = [
    "django (>=6.0.6,<7.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "pillow (>=12.2.0,<13.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "django-environ (>=0.13.0,<0.14.0)",
    "django-redis (==5.4.0)",
    "redis (==4.5.5)",
]
[tool.poetry.dependencies]
python = ">=3.12,<4.0"
django = "^6.0.6"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=2.1.0,<3.0.0)",
    "django-stubs (>=6.0.5,<7.0.0)"
]
[tool.flake8]
max-line-length = 120
ignore = ["E501"]