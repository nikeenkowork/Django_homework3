<h1>Продукты категории: {{ category }}</h1>

{% for product in products %}

    <div>
        <h2>{{ product.name }}</h2>

        <p>{{ product.description }}</p>

        <p>Цена: {{ product.price }} Kč</p>

        <a href="{% url 'product_detail' product.pk %}">
            Подробнее
        </a>
    </div>

{% empty %}

    <p>В этой категории продуктов нет.</p>

{% endfor %}
